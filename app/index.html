<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字根反查 - 拆字检索工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f5f5f5; color: #333; }

  .header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .header h1 { font-size: 20px; font-weight: 600; white-space: nowrap; }
  .mode-tabs { display: flex; border: 1px solid #d0d0d0; border-radius: 8px; overflow: hidden; }
  .mode-tabs button { padding: 10px 18px; border: none; background: #fff; font-size: 14px; cursor: pointer; transition: all 0.2s; color: #666; }
  .mode-tabs button:not(:last-child) { border-right: 1px solid #d0d0d0; }
  .mode-tabs button.active { background: #4a90d9; color: #fff; }
  .mode-tabs button:hover:not(.active) { background: #f0f0f0; }

  .main { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }

  .card {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }

  .input-row { display: flex; align-items: center; gap: 10px; }
  .input-row .input-wrap { flex: 1; position: relative; }
  .input-row input[type="text"] {
    width: 100%; padding: 10px 36px 10px 12px; border: 2px solid #d0d0d0; border-radius: 8px;
    font-size: 16px; outline: none; transition: border-color 0.2s;
  }
  .input-row input[type="text"]:focus { border-color: #4a90d9; }
  .input-row .clear-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-size: 20px; color: #999; cursor: pointer; display: none;
  }
  .input-row .clear-btn.visible { display: block; }

  .picker-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .picker-toggle {
    background: #4a90d9; color: #fff; border: none; border-radius: 6px;
    padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .picker-toggle:hover { background: #3a7bc8; }
  .picker-toggle.collapsed { background: #7badde; }
  .picker-meta { font-size: 13px; color: #888; }
  .picker-controls { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .picker-filter {
    padding: 4px 10px; border: 1px solid #d0d0d0; border-radius: 6px;
    font-size: 13px; outline: none; width: 140px;
  }
  .picker-clear-btn {
    padding: 4px 10px; border: 1px solid #d0d0d0; border-radius: 6px;
    font-size: 12px; cursor: pointer; color: #666; background: #fff;
  }
  .picker-clear-btn:hover { background: #fff1f0; border-color: #ffa39e; color: #cf1322; }

  .picker-grid {
    display: flex; flex-wrap: wrap; gap: 4px; max-height: 320px;
    overflow-y: auto; border: 1px dashed #d0d0d0; border-radius: 8px;
    padding: 10px; margin-top: 10px; background: #fcfcfc;
  }
  .picker-grid.hidden { display: none; }
  .picker-grid button {
    width: 46px; height: 46px; border: 1.5px solid #e8e8e8; border-radius: 6px;
    background: #fafafa; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .picker-grid button:hover { background: #e8f0fe; border-color: #4a90d9; transform: scale(1.05); }
  .picker-grid button.active { background: #4a90d9; color: #fff; border-color: #3a7bc8; }

  /* 谜材管理 */
  .caizi-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .caizi-header h3 { font-size: 16px; font-weight: 600; }
  .caizi-btn {
    padding: 5px 14px; border: 1px solid #d0d0d0; border-radius: 6px;
    font-size: 13px; cursor: pointer; color: #333; background: #fff; transition: all 0.15s;
  }
  .caizi-btn:hover { border-color: #4a90d9; color: #4a90d9; }
  .caizi-btn.primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  .caizi-btn.primary:hover { background: #3a7bc8; }
  .caizi-count { font-size: 13px; color: #888; margin-left: auto; }

  .caizi-import { margin-top: 12px; display: none; }
  .caizi-import.show { display: block; }
  .caizi-import-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .caizi-import-row label { font-size: 13px; color: #555; white-space: nowrap; padding-top: 8px; }
  .caizi-import-row input[type="text"] {
    flex: 1; padding: 8px 12px; border: 2px solid #d0d0d0; border-radius: 6px;
    font-size: 14px; outline: none;
  }
  .caizi-import-row input[type="text"]:focus { border-color: #4a90d9; }
  .caizi-import-row textarea {
    flex: 1; padding: 8px 12px; border: 2px solid #d0d0d0; border-radius: 6px;
    font-size: 14px; outline: none; resize: vertical; min-height: 100px; font-family: inherit;
  }
  .caizi-import-row textarea:focus { border-color: #4a90d9; }
  .caizi-import-row input[type="file"] { padding: 6px 0; font-size: 13px; }
  .caizi-import-hint { font-size: 12px; color: #aaa; margin-top: 4px; }

  .caizi-groups { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .caizi-group-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border: 1.5px solid #d0d0d0; border-radius: 20px;
    font-size: 13px; cursor: pointer; transition: all 0.15s; background: #fafafa;
  }
  .caizi-group-tag:hover { border-color: #4a90d9; }
  .caizi-group-tag.selected { background: #e8f0fe; border-color: #4a90d9; color: #4a90d9; }
  .caizi-group-tag .tag-name { user-select: none; }
  .caizi-group-tag .tag-del { margin-left: 2px; font-size: 16px; color: #ccc; line-height: 1; }
  .caizi-group-tag .tag-del:hover { color: #cf1322; }
  .caizi-group-tag .tag-count { font-size: 11px; color: #aaa; }
  .caizi-select-all {
    padding: 4px 10px; border: 1.5px solid #4a90d9; border-radius: 20px;
    font-size: 12px; cursor: pointer; background: #e8f0fe; color: #4a90d9; font-weight: 500;
  }

  /* 结果 */
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .results-header .count { font-size: 14px; color: #555; font-weight: 500; }
  .results-header .hint { font-size: 12px; color: #aaa; }
  .result-chars { display: flex; flex-wrap: wrap; gap: 6px; max-height: 400px; overflow-y: auto; }
  .result-chars span {
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; border: 1px solid #e8e8e8; border-radius: 6px;
    background: #fafafa; transition: all 0.15s; cursor: default;
  }
  .result-chars span:hover { background: #e8f0fe; border-color: #4a90d9; transform: scale(1.15); }

  .result-caizi { display: flex; flex-wrap: wrap; gap: 8px; max-height: 500px; overflow-y: auto; }
  .result-caizi-item {
    padding: 6px 14px; border: 1px solid #e8e8e8; border-radius: 6px;
    font-size: 15px; background: #fafafa; transition: all 0.15s;
    display: flex; align-items: center; gap: 4px;
  }
  .result-caizi-item:hover { background: #e8f0fe; border-color: #4a90d9; }
  .result-caizi-item .match-char { color: #cf1322; font-weight: 600; }
  .result-caizi-item .group-label { font-size: 11px; color: #aaa; margin-left: 2px; }

  .tab-bar { display: flex; border-bottom: 2px solid #e0e0e0; margin-bottom: 12px; }
  .tab-bar button {
    padding: 8px 20px; border: none; background: none; font-size: 14px;
    cursor: pointer; color: #888; border-bottom: 2px solid transparent;
    margin-bottom: -2px; transition: all 0.2s;
  }
  .tab-bar button.active { color: #4a90d9; border-bottom-color: #4a90d9; font-weight: 500; }

  .empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

  @media (max-width: 600px) {
    .header { padding: 12px 16px; }
    .main { padding: 12px 16px; }
    .header h1 { font-size: 17px; }
    .picker-grid button { width: 40px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>字根反查</h1>
  <div class="mode-tabs">
    <button class="active" data-mode="all">全部</button>
    <button data-mode="jt">简体</button>
    <button data-mode="ft">繁体</button>
  </div>
</div>

<div class="main">
  <!-- 字根输入 -->
  <div class="card">
    <div class="input-row">
      <div class="input-wrap">
        <input type="text" id="searchInput" placeholder="输入或点选字根，如：口木一 或 口 木 一" autocomplete="off">
        <button class="clear-btn" id="clearBtn">&times;</button>
      </div>
    </div>
    <div class="picker-row">
      <button class="picker-toggle" id="pickerToggle">展开偏旁笔画面板</button>
      <span class="picker-meta">共 <b id="compCount">0</b> 个可选，点击可添加到输入框</span>
      <div class="picker-controls">
        <input type="text" class="picker-filter" id="pickerFilter" placeholder="搜索偏旁笔画...">
        <button class="picker-clear-btn" id="pickerClearBtn">清空输入框</button>
      </div>
    </div>
    <div class="picker-grid hidden" id="pickerGrid"></div>
  </div>

  <!-- 谜材管理 -->
  <div class="card">
    <div class="caizi-header">
      <h3>谜材检索</h3>
      <button class="caizi-btn primary" id="showImportBtn">+ 导入谜材</button>
      <button class="caizi-btn" id="exportCaiziBtn">导出全部</button>
      <button class="caizi-btn" id="importCaiziFileBtn">导入 JSON</button>
      <input type="file" id="importCaiziFile" accept=".json" style="display:none">
      <span class="caizi-count" id="caiziSummary"></span>
    </div>
    <div class="caizi-import" id="importPanel">
      <div class="caizi-import-row">
        <label>分组名称</label>
        <input type="text" id="importName" placeholder="为这批谜材起个名字，如：成语、地名、诗词">
      </div>
      <div class="caizi-import-row">
        <label>手动输入</label>
        <div style="flex:1">
          <textarea id="importText" placeholder="每行一个词语或短句，如：&#10;春风化雨&#10;刻舟求剑&#10;守株待兔"></textarea>
          <div class="caizi-import-hint">支持换行、逗号（中英文）、顿号、空格分隔</div>
        </div>
      </div>
      <div class="caizi-import-row">
        <label>或导入文件</label>
        <div style="flex:1">
          <input type="file" id="importFile" accept=".txt,.csv">
          <div class="caizi-import-hint">支持 .txt 文件（每行一条），UTF-8 编码</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
        <button class="caizi-btn" id="cancelImportBtn">取消</button>
        <button class="caizi-btn primary" id="confirmImportBtn">确认导入</button>
      </div>
    </div>
    <div class="caizi-groups" id="caiziGroups">
      <span class="empty" style="padding:4px 12px;font-size:13px;color:#bbb;">暂无谜材，点击「导入谜材」添加</span>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card">
    <div class="tab-bar">
      <button class="active" data-tab="chars">单字检索</button>
      <button data-tab="caizi">谜材检索</button>
    </div>
    <div class="results-header">
      <span class="count" id="resultCount"></span>
      <span class="hint" id="modeHint"></span>
    </div>
    <div id="resultContent"><div class="empty">请输入或点选字根开始检索</div></div>
  </div>
</div>

<script>
const MODE_LABELS = { all: '全部（简体+繁体）', jt: '简体', ft: '繁体' };
let currentMode = 'all';
let currentTab = 'chars';
let data = {};
let allComponents = [];
let strokeMap = {};
let caiziGroups = {};
let selectedGroups = new Set();

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

function getInputComps() {
  const val = searchInput.value.trim();
  if (!val) return [];
  return [...new Set([...val].filter(ch => ch.trim()))];
}

function setInputComps(comps) {
  searchInput.value = comps.join(' ');
  clearBtn.classList.toggle('visible', comps.length > 0);
}

// ====== 初始化：加载数据 ======
async function init() {
  try {
    const [allData, jtData, ftData, strokesData, caiziData] = await Promise.all([
      fetch('data.json').then(r => r.json()),
      fetch('jt.json').then(r => r.json()),
      fetch('ft.json').then(r => r.json()),
      fetch('strokes.json').then(r => r.json()),
      fetch('/api/caizi').then(r => r.json()),
    ]);
    data = { all: allData, jt: jtData, ft: ftData };
    strokeMap = strokesData;
    caiziGroups = caiziData || {};
    selectedGroups = new Set(Object.keys(caiziGroups));

    const compSet = new Set();
    for (const db of Object.values(data)) for (const k of Object.keys(db)) if (k !== '□') compSet.add(k);
    allComponents = [...compSet].sort();
    document.getElementById('compCount').textContent = allComponents.length;
    renderPicker(allComponents);
    updateModeHint();
    renderCaiziGroups();
  } catch (e) {
    document.getElementById('resultContent').innerHTML = '<div class="empty">数据加载失败: ' + e.message + '</div>';
  }
}

// ====== 谜材 CRUD（通过 API 持久化到文件） ======
async function saveGroup(name, items) {
  await fetch('/api/caizi/save', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, items }),
  });
  caiziGroups[name] = items;
}

async function deleteGroup(name) {
  await fetch('/api/caizi/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  delete caiziGroups[name];
  selectedGroups.delete(name);
}

function renderCaiziGroups() {
  const container = document.getElementById('caiziGroups');
  const names = Object.keys(caiziGroups);
  const total = names.reduce((s, n) => s + caiziGroups[n].length, 0);
  document.getElementById('caiziSummary').textContent = names.length > 0 ? `${names.length} 组 / ${total} 条` : '';
  if (names.length === 0) {
    container.innerHTML = '<span class="empty" style="padding:4px 12px;font-size:13px;color:#bbb;">暂无谜材，点击「导入谜材」添加</span>';
    return;
  }
  const allSel = names.every(n => selectedGroups.has(n));
  let html = `<button class="caizi-select-all" onclick="toggleSelectAll()">${allSel ? '取消全选' : '全选'}</button>`;
  for (const name of names) {
    html += `<span class="caizi-group-tag ${selectedGroups.has(name) ? 'selected' : ''}" onclick="toggleGroup('${escAttr(name)}')">
      <span class="tag-name">${escHtml(name)}</span>
      <span class="tag-count">(${caiziGroups[name].length})</span>
      <span class="tag-del" onclick="event.stopPropagation();removeGroup('${escAttr(name)}')" title="删除">&times;</span>
    </span>`;
  }
  container.innerHTML = html;
}

function toggleGroup(name) {
  if (selectedGroups.has(name)) selectedGroups.delete(name); else selectedGroups.add(name);
  renderCaiziGroups();
  if (currentTab === 'caizi') searchCaizi();
}

function toggleSelectAll() {
  const names = Object.keys(caiziGroups);
  if (names.every(n => selectedGroups.has(n))) selectedGroups.clear();
  else names.forEach(n => selectedGroups.add(n));
  renderCaiziGroups();
  if (currentTab === 'caizi') searchCaizi();
}

async function removeGroup(name) {
  if (!confirm(`确定删除谜材组「${name}」？`)) return;
  await deleteGroup(name);
  renderCaiziGroups();
  if (currentTab === 'caizi') searchCaizi();
}

async function doImport(name, items) {
  if (!name.trim()) { alert('请输入分组名称'); return; }
  if (items.length === 0) { alert('没有有效的谜材内容'); return; }
  if (caiziGroups[name.trim()]) {
    if (!confirm(`分组「${name.trim()}」已存在，是否覆盖？`)) return;
  }
  await saveGroup(name.trim(), items);
  selectedGroups.add(name.trim());
  renderCaiziGroups();
  document.getElementById('importName').value = '';
  document.getElementById('importText').value = '';
  document.getElementById('importFile').value = '';
  document.getElementById('importPanel').classList.remove('show');
  if (currentTab === 'caizi') searchCaizi();
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

// ====== 检索 ======
function searchCaizi() {
  const allQuery = getInputComps();
  const rc = document.getElementById('resultCount');
  const rcon = document.getElementById('resultContent');
  if (allQuery.length === 0) { rc.textContent = ''; rcon.innerHTML = '<div class="empty">请输入或点选字根开始检索</div>'; return; }
  const index = data[currentMode];
  if (!index) return;
  let matchedChars = null;
  for (const comp of allQuery) {
    const chars = index[comp];
    if (!chars) { matchedChars = new Set(); break; }
    matchedChars = matchedChars === null ? new Set(chars) : new Set([...matchedChars].filter(c => chars.includes(c)));
  }
  const charSet = matchedChars || new Set();
  if (charSet.size === 0) { rc.textContent = '未找到匹配'; rcon.innerHTML = '<div class="empty">没有同时包含「' + allQuery.join('」和「') + '」的字，试试减少条件</div>'; return; }
  const selectedNames = [...selectedGroups].filter(n => caiziGroups[n]);
  if (selectedNames.length === 0) { rc.textContent = '请选择谜材分组'; rcon.innerHTML = '<div class="empty">请先导入谜材，并在上方勾选要检索的分组</div>'; return; }
  const results = [];
  for (const gn of selectedNames) for (const item of caiziGroups[gn]) {
    const m = []; for (const ch of item) if (charSet.has(ch)) m.push(ch);
    if (m.length > 0) results.push({ text: item, group: gn, matched: m });
  }
  const seen = new Set(); const unique = [];
  for (const r of results) if (!seen.has(r.text)) { seen.add(r.text); unique.push(r); }
  unique.sort((a, b) => Math.min(...a.matched.map(c => strokeMap[c] || 99999)) - Math.min(...b.matched.map(c => strokeMap[c] || 99999)));
  if (unique.length === 0) { rc.textContent = '未找到匹配的谜材'; rcon.innerHTML = '<div class="empty">在所选谜材中没有找到同时包含「' + allQuery.join('」和「') + '」的词语</div>'; return; }
  rc.textContent = `找到 ${unique.length} 条谜材（共匹配 ${charSet.size} 个字）`;
  const MAX = 2000; const show = unique.slice(0, MAX);
  rcon.innerHTML = '<div class="result-caizi">' + show.map(r => {
    const hl = r.text.split('').map(ch => charSet.has(ch) ? `<span class="match-char">${escHtml(ch)}</span>` : escHtml(ch)).join('');
    return `<span class="result-caizi-item">${hl}<span class="group-label">${escHtml(r.group)}</span></span>`;
  }).join('') + '</div>' + (unique.length > MAX ? `<div class="empty" style="padding:8px">结果较多，仅显示前 ${MAX} 个</div>` : '');
}

function search() {
  if (currentTab === 'caizi') { searchCaizi(); return; }
  const allQuery = getInputComps();
  const rc = document.getElementById('resultCount');
  const rcon = document.getElementById('resultContent');
  if (allQuery.length === 0) { rc.textContent = ''; rcon.innerHTML = '<div class="empty">请输入或点选字根开始检索</div>'; return; }
  const index = data[currentMode];
  if (!index) return;
  let result = null;
  for (const comp of allQuery) {
    const chars = index[comp];
    if (!chars) { result = []; break; }
    result = result === null ? new Set(chars) : new Set([...result].filter(c => chars.includes(c)));
  }
  const arr = [...(result || [])].sort((a, b) => (strokeMap[a] || 99999) - (strokeMap[b] || 99999));
  if (arr.length === 0) { rc.textContent = '未找到匹配的字'; rcon.innerHTML = '<div class="empty">没有同时包含「' + allQuery.join('」和「') + '」的字，试试减少条件</div>'; return; }
  rc.textContent = `找到 ${arr.length} 个字`;
  const MAX = 2000; const show = arr.slice(0, MAX);
  rcon.innerHTML = '<div class="result-chars">' + show.map(c => `<span title="${c}">${c}</span>`).join('') + '</div>' + (arr.length > MAX ? `<div class="empty" style="padding:8px">结果较多，仅显示前 ${MAX} 个</div>` : '');
}

function updateModeHint() { document.getElementById('modeHint').textContent = '当前：' + MODE_LABELS[currentMode]; }

function renderPicker(comps) {
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  const cur = getInputComps();
  for (const comp of comps) {
    const btn = document.createElement('button');
    btn.textContent = comp; btn.title = comp;
    if (cur.includes(comp)) btn.classList.add('active');
    btn.addEventListener('click', () => togglePickerComp(comp));
    frag.appendChild(btn);
  }
  grid.appendChild(frag);
}

function togglePickerComp(comp) {
  const cur = getInputComps();
  const idx = cur.indexOf(comp);
  if (idx >= 0) cur.splice(idx, 1); else cur.push(comp);
  setInputComps(cur); syncPickerHighlight(); search();
}

function syncPickerHighlight() {
  const cur = getInputComps();
  document.querySelectorAll('.picker-grid button').forEach(btn => btn.classList.toggle('active', cur.includes(btn.textContent)));
}

// ====== 事件 ======
searchInput.addEventListener('input', function() { clearBtn.classList.toggle('visible', this.value.trim().length > 0); syncPickerHighlight(); search(); });
clearBtn.addEventListener('click', function() { searchInput.value = ''; this.classList.remove('visible'); syncPickerHighlight(); search(); });
document.querySelectorAll('.mode-tabs button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active'));
    this.classList.add('active'); currentMode = this.dataset.mode; updateModeHint(); search();
  });
});
document.getElementById('pickerToggle').addEventListener('click', function() {
  const grid = document.getElementById('pickerGrid'); grid.classList.toggle('hidden');
  const c = grid.classList.contains('hidden');
  this.textContent = c ? '展开偏旁笔画面板' : '收起偏旁笔画面板'; this.classList.toggle('collapsed', c);
});
document.getElementById('pickerFilter').addEventListener('input', function() {
  const kw = this.value.trim(); renderPicker(kw ? allComponents.filter(c => c.includes(kw)) : allComponents);
});
document.getElementById('pickerClearBtn').addEventListener('click', function() { searchInput.value = ''; clearBtn.classList.remove('visible'); syncPickerHighlight(); search(); });
document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    this.classList.add('active'); currentTab = this.dataset.tab; search();
  });
});
document.getElementById('showImportBtn').addEventListener('click', function() { document.getElementById('importPanel').classList.toggle('show'); });
document.getElementById('cancelImportBtn').addEventListener('click', function() { document.getElementById('importPanel').classList.remove('show'); });
document.getElementById('importFile').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader(); reader.onload = ev => { document.getElementById('importText').value = ev.target.result; };
  reader.readAsText(file, 'UTF-8');
});
document.getElementById('confirmImportBtn').addEventListener('click', function() {
  const name = document.getElementById('importName').value.trim();
  const text = document.getElementById('importText').value.trim();
  if (!name) { alert('请输入分组名称'); return; }
  if (!text) { alert('请输入谜材内容或导入文件'); return; }
  const items = [...new Set(text.split(/[\n,，、\s]+/).map(s => s.trim()).filter(Boolean))];
  doImport(name, items);
});
document.getElementById('exportCaiziBtn').addEventListener('click', function() {
  if (Object.keys(caiziGroups).length === 0) { alert('暂无谜材数据可导出'); return; }
  const blob = new Blob([JSON.stringify(caiziGroups, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '谜材数据.json'; a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('importCaiziFileBtn').addEventListener('click', function() { document.getElementById('importCaiziFile').click(); });
document.getElementById('importCaiziFile').addEventListener('change', function(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      const count = Object.keys(imported).length;
      if (count === 0) { alert('文件中没有谜材数据'); return; }
      const overlap = Object.keys(imported).filter(n => caiziGroups[n]);
      if (overlap.length > 0 && !confirm(`发现 ${overlap.length} 个同名分组，将覆盖已有数据。继续？`)) return;
      for (const [name, items] of Object.entries(imported)) await saveGroup(name, items);
      selectedGroups = new Set(Object.keys(caiziGroups));
      renderCaiziGroups();
    } catch (err) { alert('文件格式错误：' + err.message); }
  };
  reader.readAsText(file, 'UTF-8'); this.value = '';
});

init();
</script>
</body>
</html>
